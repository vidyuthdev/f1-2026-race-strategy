# Conda environment used to produce the committed results.
#   conda env create -f environment.yml
#   conda activate f1
name: f1
channels:
  - conda-forge
dependencies:
  - python=3.11.15
  - pip
  - pip:
      - fastf1==3.8.3
      - numpy==2.4.6
      - pandas==2.3.3
      - matplotlib==3.11.0
      - requests==2.34.2
      - scipy==1.17.1
      - statsmodels==0.15.0
      - jupyter==1.1.1
      - notebook==7.6.0
      - ipykernel==7.3.0
